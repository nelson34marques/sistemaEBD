services:
  - type: web
    name: ebd-api
    runtime: python
    plan: free
    pythonVersion: 3.12.7
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn api:app --bind 0.0.0.0:$PORT --workers 1 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: FIREBASE_PROJECT_ID
        value: icea53
      - key: API_ALLOWED_ORIGINS
        value: https://icea-bd.vercel.app
      - key: API_ALLOWED_EMAILS
        sync: false
      - key: API_RATE_LIMIT
        value: "120 per minute"
      - key: API_REQUIRE_AUTH
        value: "false"
      # Publicação da base de dados a partir do app desktop (botão "Publicar no site")
      - key: SYNC_TOKEN
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: nelson34marques/sistemaEBD
      - key: GITHUB_PATH
        value: database.sqlite
      - key: GITHUB_BRANCH
        value: main
      - key: GITHUB_COMMIT_MESSAGE
        value: Actualizar base de dados pelo app Secretaria EBD
